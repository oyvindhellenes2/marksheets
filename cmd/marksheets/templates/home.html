{{define "title"}}Sider — Marksheets{{end}}

{{define "content"}}
<section class="home">
	<h1 class="home-title">Sider</h1>

	{{if not .Repo}}
	<div class="vcs-offer">
		<div>
			<strong>Slå på historikk?</strong>
			<span>Sidemappa er ikkje eit git-repo. Med git blir kvar lagring ein commit du kan lese og gå tilbake til.</span>
		</div>
		<button class="btn" hx-post="/vcs/init" hx-swap="none">Start git her</button>
	</div>
	{{end}}

	<form class="new-page" hx-post="/pages" hx-swap="none">
		<input type="text" name="title" placeholder="Namn på ny side" autocomplete="off" required>
		<button type="submit" class="btn">Lag side</button>
	</form>

	<div id="page-list">
		{{template "page-list-partial.html" .}}
	</div>
</section>
{{end}}
