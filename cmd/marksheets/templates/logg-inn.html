{{define "title"}}Logg inn — {{.Nav.Site}}{{end}}

{{define "content"}}
<section class="login">
	<h1 class="home-title">{{.Nav.Site}}</h1>
	<p class="login-note">Du må vere innlogga for å lese og skrive her.</p>
	<a class="btn login-go" href="/logg-inn/start?attende={{.Back}}">Logg inn med Pocket ID</a>
	{{if .Issuer}}<p class="login-where">Du blir send til <code>{{.Issuer}}</code> og kjem hit att.</p>{{end}}
</section>
{{end}}
