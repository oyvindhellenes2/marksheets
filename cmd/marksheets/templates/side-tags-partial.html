<div id="side-tags">
	{{if .Tags}}
	<nav class="side-tags">
		<a class="tag-link{{if not .Active}} is-active{{end}}" href="/sidemeny"
			hx-get="/sidemeny" hx-target="#side-tags" hx-swap="outerHTML">alle</a>
		{{range .Tags}}
		<a class="tag-link{{if eq .Name $.Active}} is-active{{end}}" href="/sidemeny?emne={{.Name}}"
			hx-get="/sidemeny?emne={{.Name}}" hx-target="#side-tags" hx-swap="outerHTML"
			>#{{.Name}} <span class="tag-count">{{.Count}}</span></a>
		{{end}}
	</nav>
	{{/* Shown by chrome.js only when the tags are actually taller than the clamp —
	     how many rows five is depends on how long the words are, which is a
	     question for the browser rather than for this template. */}}
	<button type="button" class="tag-more" hidden>Vis meir</button>
	{{end}}
</div>
